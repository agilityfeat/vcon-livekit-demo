[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcon-livekit-demo-agent"
version = "0.1.0"
description = "LiveKit voice intake agent that assembles an unsigned vCon skeleton."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "livekit-agents>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-elevenlabs>=1.0",
    "livekit-plugins-openai>=1.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
