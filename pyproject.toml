[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcon-livekit-demo-agent"
version = "0.1.0"
description = "LiveKit voice intake agent that assembles an unsigned vCon skeleton."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "livekit-agents>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-elevenlabs>=1.0",
    "livekit-plugins-openai>=1.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    # JWS/JWE/JWK primitives for signing, encrypting, and the redacted
    # vCon. jwcrypto is a pure-Python JOSE library on top of `cryptography`; the
    # pure sealing core (src/vcon_agent/sealing.py) imports it at runtime, so it
    # is a main dependency. Installable on requires-python >=3.9.
    "jwcrypto>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Runtime deps for the local end-to-end demo backend: a FastAPI app served by
# uvicorn that mints LiveKit patient access tokens and reads/verifies/decrypts
# the vCon artifacts for the doctor/analyst viewers. livekit-api is the server
# token/REST SDK (provides livekit.api.AccessToken) and is distinct from the
# livekit-agents worker SDK in the main deps. python-dotenv is already a main
# dependency, so it is not repeated here.
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "livekit-api>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
