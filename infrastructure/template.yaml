AWSTemplateFormatVersion: '2010-09-09'

# =============================================================================
# Cloud infrastructure for the vCon + LiveKit demo
# -----------------------------------------------------------------------------
# A single, flat CloudFormation template that provisions the minimal AWS backend
# the local application consumes:
#
#   * S3 bucket        - holds recordings (from LiveKit Egress) plus the
#                        skeleton / enriched / redacted vCon JSON documents,
#                        using a unique-key-per-run convention
#                        (room_name + session start prefix).
#   * Lambda functions - the enrichment pipeline steps, invoked by the state
#                        machine. Inline Python via Code.ZipFile. Each step
#                        MIRRORS the pure, offline-tested logic in
#                        src/vcon_agent/enrichment.py + vcon.py (inline code
#                        cannot import the repo package at AWS runtime).
#   * State machine    - Step Functions orchestrator that runs the real
#                        enrichment pipeline (poll S3 -> Transcribe Medical async
#                        batch awaited by the state machine -> Comprehend Medical
#                        + Bedrock in parallel -> merge into analysis[]); started
#                        by the agent (persistence.py) via StartExecution.
#   * IAM roles        - a Step Functions execution role and a Lambda execution
#                        role granting the permissions the pipeline needs.
#
# Why Step Functions over a single Lambda: Transcribe Medical batch is ASYNC and
# can exceed Lambda's hard 15-minute timeout. The state machine OWNS the waiting
# (a Wait state + GetMedicalTranscriptionJob poll + a Choice loop) plus the
# retry/catch, so no Lambda ever sleeps past its timeout waiting for the batch
# job. Each Lambda does one short unit of work and returns.
#
# Explicitly NOT created (these are managed services you CALL, not resources you
# create - the template only grants IAM permission to use them):
#   * Transcribe Medical, Comprehend Medical, Bedrock
#   * Bedrock model access (a per-model console opt-in; see docs/infrastructure.md, "Bedrock model access")
#   * No EventBridge / webhook endpoint (enrichment is triggered via
#     StartExecution by the agent at session end, with a deterministic idempotent name)
#   * No compute for the agent (no ECS / EC2 / Fargate; the agent runs locally)
# =============================================================================

# AWS SAM transform. The Seal pipeline step is an AWS::Serverless::Function that
# is container-built (sam build --use-container) so it can ship the third-party
# jwcrypto dependency and import the packaged functions/seal/sealing.py core
# instead of mirroring the crypto by hand. The other seven pipeline steps remain plain
# inline-code AWS::Lambda::Function resources (they import only boto3), which the
# SAM transform passes through unchanged.
Transform: AWS::Serverless-2016-10-31

Description: >-
  Cloud infrastructure for the vCon + LiveKit demo: an S3 bucket
  (versioning + SSE-S3), a Step Functions state machine orchestrating a real
  enrichment pipeline (Transcribe Medical async batch, Comprehend Medical, and
  Bedrock) with turn-level provenance, inline-code pipeline Lambda functions, and
  least-needed IAM roles for Transcribe Medical / Comprehend Medical / Bedrock /
  S3.

Parameters:
  ProjectName:
    Type: String
    Default: vcon-livekit-demo
    Description: >-
      Short name used to compose resource names and tags. Lowercase letters,
      digits and hyphens.
    AllowedPattern: '^[a-z0-9-]+$'
    MinLength: 3
    MaxLength: 40

  Environment:
    Type: String
    Default: dev
    Description: Deployment environment suffix used in resource names and tags.
    AllowedValues:
      - dev
      - staging
      - prod

  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-5-5
    Description: >-
      Bedrock model (inference profile) id the summary step invokes. Defaults
      to the global cross-region inference profile for Claude Haiku 5.5. Newer
      Claude models on Bedrock are cross-region-inference only, so this must be
      an inference-profile id (base id with a region prefix such as global.,
      us., eu., au., or jp.), not the bare base id anthropic.claude-haiku-5-5,
      which returns HTTP 400 on the bedrock-runtime InvokeModel endpoint.
      Override at deploy time with --parameter-overrides to pin a different
      model or a geo profile (e.g. us.anthropic.claude-haiku-5-5).

  VconSigningPrivateJwk:
    Type: String
    Default: ''
    NoEcho: true
    Description: >-
      Shared JWS/JWE demo signing key for the Seal step: a JWK JSON document or
      a PEM string. It MUST match the backend's .env VCON_SIGNING_PRIVATE_JWK so
      the backend can decrypt/verify the records the Seal step produces. Leaving
      it empty makes the Seal step generate an ephemeral per-invocation key
      whose sealed records can never be decrypted or verified by the backend.

Resources:

  # ---------------------------------------------------------------------------
  # S3 bucket: recordings + skeleton/enriched/redacted vCons.
  #
  # BucketName is derived with !Sub from ProjectName + Environment + AccountId +
  # Region so it is globally unique and does not collide across accounts/regions.
  #
  # Shortcut: SSE-S3 (AES256) default encryption, not a
  # customer-managed KMS key. Production would use SSE-KMS with a CMK, a key
  # policy, and separate access scopes for full vs. redacted vCons.
  #
  # Versioning is enabled as cheap insurance against accidental object overwrites.
  # ---------------------------------------------------------------------------
  RecordingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Lambda execution role (trusts lambda.amazonaws.com).
  #
  # Shortcut: BROAD-ISH, SERVICE-LEVEL IAM for demo readability -
  # a single shared role, service-level actions, and a single bucket scope.
  # Production would use least-privilege per action/resource, condition keys, and
  # a separate role per Lambda.
  # ---------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # CloudWatch Logs (AWSLambdaBasicExecutionRole-equivalent).
        - PolicyName: cloudwatch-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'
        # Transcribe Medical: start/get transcription jobs.
        - PolicyName: transcribe-medical
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - transcribe:StartMedicalTranscriptionJob
                  - transcribe:GetMedicalTranscriptionJob
                  - transcribe:ListMedicalTranscriptionJobs
                Resource: '*'
        # Comprehend Medical: entity + PHI detection (the V2 detectors).
        - PolicyName: comprehend-medical
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - comprehendmedical:DetectEntitiesV2
                  - comprehendmedical:DetectPHI
                  - comprehendmedical:InferICD10CM
                  - comprehendmedical:InferRxNorm
                Resource: '*'
        # Bedrock: invoke a foundation model for enrichment/summarisation.
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
        # S3 read/write scoped to the created bucket and its objects. The S3
        # poll step uses HeadObject, which is authorized by s3:GetObject (object
        # scope) plus s3:ListBucket (bucket scope), both granted here.
        - PolicyName: s3-bucket-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !GetAtt RecordingsBucket.Arn
                  - !Sub '${RecordingsBucket.Arn}/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Pipeline Lambda functions (REAL enrichment, inline code).
  #
  # Each function performs one short unit of work and returns, so no Lambda ever
  # sleeps waiting on the async Transcribe Medical batch job (the STATE MACHINE
  # owns that wait via a Wait + Choice loop). The inline bodies RESTATE the pure,
  # offline-tested logic from src/vcon_agent/enrichment.py + vcon.py, because
  # inline code cannot import the repo package at AWS runtime.
  #
  # Envelope convention (unchanged): every step unwraps its input EXACTLY ONCE
  # with event.get("vcon", event). The first step receives the raw StartExecution
  # input {"vcon": <doc>}; each later step receives the previous step's output
  # envelope {"vcon": <doc>, ...}. One unwrap always yields the vCon document.
  #
  # Shortcut: inline code via Code.ZipFile instead of versioned
  # artifacts in S3/ECR built by a CI/CD pipeline.
  # ---------------------------------------------------------------------------

  # Step 1: poll S3 for the recording object before transcribing, so the pipeline
  # never runs on a missing or partial file. Returns a `recording_ready` boolean
  # the state machine Choice loops on. HeadObject is authorized by s3:GetObject +
  # s3:ListBucket on the bucket.
  PollRecordingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-poll-recording-step'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref RecordingsBucket
      Code:
        ZipFile: |
          # Poll S3 for the recording object (HeadObject) so the pipeline never
          # transcribes a missing or partial file. Returns recording_ready as a
          # boolean plus the resolved recording key for later steps.
          #
          # Unwrap convention: one event.get("vcon", event) yields the vCon doc.
          import os

          import boto3

          _S3 = boto3.client("s3")


          def _recording_key(vcon):
              # Prefer a recording dialog object's s3:// url (threaded on by the
              # agent). Fall back to a key the envelope may already carry.
              for d in vcon.get("dialog", []):
                  if d.get("type") == "recording" and isinstance(d.get("url"), str):
                      url = d["url"]
                      if url.startswith("s3://"):
                          # s3://<bucket>/<key> -> <key>
                          rest = url[len("s3://"):]
                          parts = rest.split("/", 1)
                          if len(parts) == 2:
                              return parts[1]
              return None


          def handler(event, context):
              vcon = event.get("vcon", event)
              bucket = os.environ.get("BUCKET_NAME", "")
              key = event.get("recording_key") or _recording_key(vcon)

              ready = False
              # 🩹 Shortcut: if there is no recording key at all (e.g. the canned
              # validator input has no real recording), report ready=True so the
              # downstream canned-transcript stub path can run the pipeline end to
              # end without a real file. → Production: require a real recording
              # key and fail closed if it never appears within the SLA.
              if not key or not bucket:
                  ready = True
              else:
                  try:
                      _S3.head_object(Bucket=bucket, Key=key)
                      ready = True
                  except Exception:
                      ready = False

              return {
                  "vcon": vcon,
                  "step": "poll-recording",
                  "recording_key": key,
                  "recording_ready": ready,
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Step 2: load the skeleton vCon from S3 under the run-key prefix. In the
  # current wiring the agent triggers the pipeline with StartExecution carrying
  # the skeleton inlined by value ({"vcon": <doc>}) and passes NO skeleton_key,
  # so the envelope already carries the doc and this step is a REDUNDANT
  # pass-through today -- it just normalizes the envelope for the next state.
  # It is kept intentionally as a reserved seam for the planned event-driven
  # trigger (S3 object-created event -> EventBridge -> Step Functions, or
  # S3 -> Lambda -> StartExecution), where the pipeline would receive only an
  # object KEY instead of the inlined document and would use the skeleton_key
  # branch below to read the authoritative skeleton from S3. Do not delete this
  # as dead code when that trigger is built.
  LoadSkeletonFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-load-skeleton-step'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref RecordingsBucket
      Code:
        ZipFile: |
          # Load the skeleton vCon for this run. The agent already PUTs the
          # skeleton to S3 and passes {"vcon": <doc>} into StartExecution, so the
          # doc is present on the envelope; if a `skeleton_key` is supplied we
          # re-read the authoritative copy from S3 instead.
          #
          # Two modes: BY-VALUE (current/demo) -- the doc is inlined on the
          # envelope and no skeleton_key arrives, so this handler just forwards
          # it. BY-REFERENCE (planned event-driven trigger) -- only a
          # skeleton_key arrives, so this handler reads the doc from S3 by key.
          #
          # Unwrap convention: one event.get("vcon", event) yields the vCon doc.
          import json
          import os

          import boto3

          _S3 = boto3.client("s3")


          def handler(event, context):
              vcon = event.get("vcon", event)
              bucket = os.environ.get("BUCKET_NAME", "")
              skeleton_key = event.get("skeleton_key")
              if bucket and skeleton_key:
                  try:
                      obj = _S3.get_object(Bucket=bucket, Key=skeleton_key)
                      loaded = json.loads(obj["Body"].read())
                      if isinstance(loaded, dict) and loaded.get("vcon"):
                          vcon = loaded
                  except Exception:
                      # Fall back to the doc already on the envelope.
                      pass
              return {
                  "vcon": vcon,
                  "step": "load-skeleton",
                  "recording_key": event.get("recording_key"),
                  "recording_ready": event.get("recording_ready"),
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Step 3: start the Transcribe Medical BATCH job (async). Returns the job name;
  # the state machine then polls for completion with its own Wait + Choice loop.
  StartTranscriptionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-start-transcription-step'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref RecordingsBucket
      Code:
        ZipFile: |
          # Start an async Transcribe Medical batch job on the recording. Returns
          # a job_name; the STATE MACHINE (not this Lambda) owns the wait for
          # completion, because a real batch job can exceed Lambda's 15-min
          # timeout.
          #
          # 🩹 Shortcut: if there is no real recording (no key / HeadObject never
          # succeeded) OR starting the job fails, fall back to a canned transcript
          # so the pipeline is runnable without a real recording. The canned text
          # is carried on the envelope and the GetTranscription step returns it
          # immediately. The fallback is now logged to CloudWatch and records a
          # transcription_canned_reason on the envelope so the substitution is
          # visible rather than silent. → Production: always start a real job (or
          # use AWS HealthScribe for clinician-grade notes + transcript in one
          # service).
          #
          # Unwrap convention: one event.get("vcon", event) yields the vCon doc.
          import logging
          import os
          import time

          import boto3

          _TRANSCRIBE = boto3.client("transcribe")

          _CANNED_TRANSCRIPT = (
              "Patient reports a headache for three days and is taking ibuprofen."
          )

          # 🩹 Demo stub: a canned Transcribe-Medical-shaped result that carries
          # the SAME sentence as _CANNED_TRANSCRIPT but split across two speakers
          # (spk_0 / spk_1) with word-level timings and a speaker_labels block, so
          # the no-recording path still exercises the structured segments ->
          # reconciliation -> turns flow end to end offline. GetTranscription's
          # canned path turns this into transcript_segments; transcript_text stays
          # _CANNED_TRANSCRIPT verbatim so the summary/comprehend source is
          # unchanged. → Production: a real Transcribe Medical result (or AWS
          # HealthScribe) with real diarized, timestamped segments.
          _CANNED_TRANSCRIBE_RESULT = {
              "results": {
                  "transcripts": [{"transcript": _CANNED_TRANSCRIPT}],
                  "items": [
                      {"start_time": "0.0", "end_time": "0.4",
                       "alternatives": [{"content": "Patient"}]},
                      {"start_time": "0.4", "end_time": "0.7",
                       "alternatives": [{"content": "reports"}]},
                      {"start_time": "0.7", "end_time": "0.9",
                       "alternatives": [{"content": "a"}]},
                      {"start_time": "0.9", "end_time": "1.3",
                       "alternatives": [{"content": "headache"}]},
                      {"start_time": "1.3", "end_time": "1.6",
                       "alternatives": [{"content": "for"}]},
                      {"start_time": "1.6", "end_time": "1.9",
                       "alternatives": [{"content": "three"}]},
                      {"start_time": "1.9", "end_time": "2.3",
                       "alternatives": [{"content": "days"}]},
                      {"start_time": "2.3", "end_time": "2.6",
                       "alternatives": [{"content": "and"}]},
                      {"start_time": "2.6", "end_time": "2.8",
                       "alternatives": [{"content": "is"}]},
                      {"start_time": "2.8", "end_time": "3.2",
                       "alternatives": [{"content": "taking"}]},
                      {"start_time": "3.2", "end_time": "3.8",
                       "alternatives": [{"content": "ibuprofen"}]},
                      {"type": "punctuation",
                       "alternatives": [{"content": "."}]},
                  ],
                  "speaker_labels": {
                      "segments": [
                          {"speaker_label": "spk_0", "start_time": "0.0",
                           "end_time": "1.3"},
                          {"speaker_label": "spk_1", "start_time": "1.3",
                           "end_time": "3.8"},
                      ]
                  },
              }
          }


          def handler(event, context):
              vcon = event.get("vcon", event)
              bucket = os.environ.get("BUCKET_NAME", "")
              key = event.get("recording_key")
              ready = bool(event.get("recording_ready"))

              job_name = "vcon-tm-{}".format(int(time.time() * 1000))

              # Always populate a reason on the canned path so operators can tell
              # a missing-recording fallback apart from a real start-job failure.
              canned_reason = "no recording available"

              if ready and bucket and key:
                  try:
                      _TRANSCRIBE.start_medical_transcription_job(
                          MedicalTranscriptionJobName=job_name,
                          LanguageCode="en-US",
                          Specialty="PRIMARYCARE",
                          Type="CONVERSATION",
                          Media={"MediaFileUri": "s3://{}/{}".format(bucket, key)},
                          OutputBucketName=bucket,
                          # Request diarization so the result JSON carries
                          # speaker_labels.segments (spk_0 = patient, spk_1 =
                          # agent, reconciled downstream). MaxSpeakerLabels must be
                          # >= 2 for the two-party intake call. NOTE: the exact
                          # Settings shape for the MEDICAL transcription API must
                          # be verified against a live job; if the medical API
                          # uses a different key, swap to the documented medical
                          # key here.
                          Settings={
                              "ShowSpeakerLabels": True,
                              "MaxSpeakerLabels": 2,
                          },
                      )
                      return {
                          "vcon": vcon,
                          "step": "start-transcription",
                          "recording_key": key,
                          "job_name": job_name,
                          "canned": False,
                      }
                  except Exception as exc:
                      # Fail open to the canned-transcript stub path, but log the
                      # caught exception to CloudWatch and record why we fell back
                      # so the failure is visible instead of silent.
                      logging.getLogger().exception(
                          "start_medical_transcription_job failed; "
                          "falling back to canned transcript"
                      )
                      canned_reason = (
                          "start_medical_transcription_job failed: {}: {}".format(
                              type(exc).__name__, exc
                          )
                      )

              # Canned-transcript stub path. Carry both the flat canned text
              # (for transcript_text) and the canned Transcribe-shaped result
              # (which GetTranscription parses into transcript_segments) so the
              # structured turns path runs end to end offline.
              return {
                  "vcon": vcon,
                  "step": "start-transcription",
                  "recording_key": key,
                  "job_name": job_name,
                  "canned": True,
                  "canned_transcript": _CANNED_TRANSCRIPT,
                  "canned_result": _CANNED_TRANSCRIBE_RESULT,
                  "transcription_canned_reason": canned_reason,
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Step 4: poll the Transcribe Medical job once and report its status. The state
  # machine loops Wait -> this -> Choice until COMPLETED/FAILED, so the >15-min
  # wait lives in the state machine, never in a Lambda.
  GetTranscriptionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-get-transcription-step'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          # Poll the Transcribe Medical job ONCE and report status + transcript.
          # The state machine Wait + Choice loop drives repeated calls until the
          # job reaches COMPLETED or FAILED.
          #
          # transcript_text_from_transcribe_result mirrors enrichment.py: the
          # Transcribe result JSON is
          #   {"results": {"transcripts": [{"transcript": "<text>"}, ...]}}.
          #
          # The completed job is started with OutputBucketName set, so its
          # TranscriptFileUri points at an auth-required S3 object. We read it
          # through the S3 client (get_object) via s3_location_from_transcribe_uri
          # (mirrored from enrichment.py), NOT an unauthenticated urllib fetch,
          # which would 403 against the signed S3 URL.
          #
          # Unwrap convention: one event.get("vcon", event) yields the vCon doc.
          import json

          import boto3

          _TRANSCRIBE = boto3.client("transcribe")
          _S3 = boto3.client("s3")


          def _transcript_text_from_transcribe_result(result_json):
              results = result_json.get("results") or {}
              transcripts = results.get("transcripts") or []
              parts = [
                  t.get("transcript", "")
                  for t in transcripts
                  if t.get("transcript")
              ]
              return " ".join(parts).strip()


          def _as_float(value):
              # Mirror of enrichment._as_float: numeric/numeric-string -> float,
              # ISO strings (and everything else) -> None.
              if value is None or isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return float(value)
              if isinstance(value, str):
                  try:
                      return float(value)
                  except ValueError:
                      return None
              return None


          def _text_for_window(parsed_items, seg_start, seg_end):
              # Mirror of enrichment._text_for_window: join the word items whose
              # timing falls in [seg_start, seg_end]; punctuation (no timestamps)
              # glues onto the preceding kept word with no leading space.
              pieces = []
              kept_previous_word = False
              for item in parsed_items:
                  if item["is_punct"]:
                      if kept_previous_word and pieces:
                          pieces[-1] = pieces[-1] + item["content"]
                      continue
                  start = item["start"]
                  end = item["end"]
                  if start is None:
                      kept_previous_word = False
                      continue
                  word_end = end if end is not None else start
                  if seg_start <= start and word_end <= seg_end:
                      pieces.append(item["content"])
                      kept_previous_word = True
                  else:
                      kept_previous_word = False
              return " ".join(pieces).strip()


          def _segments_from_transcribe_result(result_json):
              # Mirror of enrichment.segments_from_transcribe_result: one dict per
              # results.speaker_labels.segments[] entry
              # ({'speaker','start','end','text'}), text rebuilt by bucketing the
              # results.items[] word items into each segment's [start,end] window.
              # Falls back to a single spk_0 flat-transcript segment when
              # speaker_labels is missing/empty.
              results = result_json.get("results") or {}
              speaker_labels = results.get("speaker_labels") or {}
              segments = speaker_labels.get("segments") or []
              items = results.get("items") or []

              flat_text = _transcript_text_from_transcribe_result(result_json)

              if not segments:
                  return [
                      {"speaker": "spk_0", "start": None, "end": None,
                       "text": flat_text}
                  ]

              parsed_items = []
              for item in items:
                  alternatives = item.get("alternatives") or []
                  content = alternatives[0].get("content") if alternatives else ""
                  is_punct = item.get("type") == "punctuation"
                  start = _as_float(item.get("start_time"))
                  end = _as_float(item.get("end_time"))
                  parsed_items.append(
                      {
                          "start": start,
                          "end": end,
                          "content": content or "",
                          "is_punct": is_punct,
                      }
                  )

              out = []
              for seg in segments:
                  speaker = seg.get("speaker_label", "spk_0")
                  seg_start = _as_float(seg.get("start_time"))
                  seg_end = _as_float(seg.get("end_time"))
                  text = ""
                  if parsed_items and seg_start is not None and seg_end is not None:
                      text = _text_for_window(parsed_items, seg_start, seg_end)
                  if not text:
                      text = flat_text
                  out.append(
                      {
                          "speaker": speaker,
                          "start": seg_start,
                          "end": seg_end,
                          "text": text,
                      }
                  )
              return out


          def _s3_location_from_transcribe_uri(uri):
              if not isinstance(uri, str) or not uri:
                  return None
              if uri.startswith("s3://"):
                  rest = uri[len("s3://"):]
                  parts = rest.split("/", 1)
                  if len(parts) == 2 and parts[0] and parts[1]:
                      return (parts[0], parts[1])
                  return None
              if uri.startswith("https://") or uri.startswith("http://"):
                  without_scheme = uri.split("://", 1)[1]
                  host, _, path = without_scheme.partition("/")
                  path = path.split("?", 1)[0]
                  if not host or not path:
                      return None
                  labels = host.split(".")
                  if len(labels) >= 2 and (
                      labels[1] == "s3" or labels[1].startswith("s3-")
                  ):
                      bucket = labels[0]
                      if bucket and path:
                          return (bucket, path)
                      return None
                  if labels and (labels[0] == "s3" or labels[0].startswith("s3-")):
                      parts = path.split("/", 1)
                      if len(parts) == 2 and parts[0] and parts[1]:
                          return (parts[0], parts[1])
                      return None
              return None


          def handler(event, context):
              vcon = event.get("vcon", event)

              # 🩹 Canned-transcript stub path: skip the real poll entirely and
              # report COMPLETED immediately with the canned text. → Production:
              # always poll the real job.
              if event.get("canned"):
                  # Derive structured segments from the canned Transcribe-shaped
                  # fixture carried by StartTranscription, keeping transcript_text
                  # exactly the canned flat string so the summary/comprehend
                  # source is unchanged.
                  canned_result = event.get("canned_result") or {}
                  canned_segments = (
                      _segments_from_transcribe_result(canned_result)
                      if canned_result
                      else []
                  )
                  return {
                      "vcon": vcon,
                      "step": "get-transcription",
                      "recording_key": event.get("recording_key"),
                      "job_name": event.get("job_name"),
                      "transcription_status": "COMPLETED",
                      "transcript_text": event.get("canned_transcript", ""),
                      "transcript_segments": canned_segments,
                  }

              job_name = event.get("job_name")
              status = "FAILED"
              transcript_text = ""
              transcript_segments = []
              try:
                  resp = _TRANSCRIBE.get_medical_transcription_job(
                      MedicalTranscriptionJobName=job_name
                  )
                  job = resp.get("MedicalTranscriptionJob", {})
                  status = job.get("TranscriptionJobStatus", "IN_PROGRESS")
                  if status == "COMPLETED":
                      uri = job.get("Transcript", {}).get("TranscriptFileUri")
                      location = _s3_location_from_transcribe_uri(uri)
                      if location:
                          bucket, key = location
                          obj = _S3.get_object(Bucket=bucket, Key=key)
                          result_json = json.loads(obj["Body"].read())
                          transcript_text = _transcript_text_from_transcribe_result(
                              result_json
                          )
                          # Parse speaker-labeled, timestamped segments from the
                          # same result JSON and carry them ALONGSIDE the
                          # unchanged transcript_text.
                          transcript_segments = _segments_from_transcribe_result(
                              result_json
                          )
              except Exception:
                  status = "IN_PROGRESS"

              out = {
                  "vcon": vcon,
                  "step": "get-transcription",
                  "recording_key": event.get("recording_key"),
                  "job_name": job_name,
                  "transcription_status": status,
              }
              if status == "COMPLETED":
                  out["transcript_text"] = transcript_text
                  out["transcript_segments"] = transcript_segments
              return out
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Parallel branch A: Comprehend Medical entity extraction (meds + conditions).
  ComprehendFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-comprehend-step'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          # Comprehend Medical: extract clinical entities from the authoritative
          # transcript, filtered to meds + conditions (extract_min_entities,
          # mirrored from enrichment.py). Returns the shaped entity list and the
          # dialog turn index they are attributed to for provenance.
          #
          # Unwrap convention: one event.get("vcon", event) yields the vCon doc.
          import logging

          import boto3

          _CM = boto3.client("comprehendmedical")

          _KEPT_CATEGORIES = frozenset({"MEDICATION", "MEDICAL_CONDITION"})


          def _extract_min_entities(comprehend_response):
              entities = comprehend_response.get("Entities") or []
              minimal = []
              for ent in entities:
                  category = ent.get("Category")
                  if category not in _KEPT_CATEGORIES:
                      continue
                  shaped = {"category": category, "text": ent.get("Text")}
                  if ent.get("Score") is not None:
                      shaped["score"] = ent.get("Score")
                  minimal.append(shaped)
              return minimal


          def _first_patient_turn_index(vcon):
              # Attribute entities to the first patient (party 0) text turn, else
              # the first text turn, else 0. 🩹 Shortcut: single-turn attribution.
              # → Production: per-entity offsets mapped to turns.
              first_text = None
              for idx, d in enumerate(vcon.get("dialog", [])):
                  if d.get("type") == "text":
                      if first_text is None:
                          first_text = idx
                      if d.get("party") == 0:
                          return idx
              return first_text if first_text is not None else 0


          def handler(event, context):
              vcon = event.get("vcon", event)
              transcript_text = event.get("transcript_text", "") or ""

              entities = []
              # 🩹 Fail-open for demo-runnability: a Comprehend Medical failure
              # (model access denied, throttling, etc.) returns EMPTY entities
              # rather than failing the whole execution, BUT we carry a degraded
              # marker so an operator can tell a real "no meds/conditions
              # mentioned" apart from a silent failure. → Production: a Catch to a
              # visible alarm state, retries with backoff, and a hard failure path
              # surfaced to operators.
              degraded = None
              if transcript_text:
                  try:
                      resp = _CM.detect_entities_v2(Text=transcript_text)
                      entities = _extract_min_entities(resp)
                  except Exception as exc:
                      logging.getLogger().exception(
                          "comprehend-medical call failed"
                      )
                      entities = []
                      degraded = "comprehend-medical call failed: {}: {}".format(
                          type(exc).__name__, exc
                      )

              return {
                  "vcon": vcon,
                  "step": "comprehend",
                  "recording_key": event.get("recording_key"),
                  "entities": entities,
                  "entities_dialog_index": _first_patient_turn_index(vcon),
                  "transcript_text": transcript_text,
                  # Re-emit verbatim so Step Functions carries the structured
                  # segments from GetTranscription through to Merge (passed over
                  # unchanged; only Merge reconciles them).
                  "transcript_segments": event.get("transcript_segments"),
                  "entities_degraded": degraded,
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Parallel branch B: Bedrock physician summary.
  BedrockFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-bedrock-step'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      # BEDROCK_MODEL_ID is an inference-profile id (see the BedrockModelId
      # parameter). Invoking via an inference profile can require
      # bedrock:InvokeModel on BOTH the inference-profile ARN and the underlying
      # foundation-model ARNs across every routed region. The LambdaExecutionRole
      # bedrock-invoke policy already uses Resource: '*', which covers this, so a
      # future least-privilege pass must not scope it in a way that breaks
      # cross-region routing.
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Code:
        ZipFile: |
          # Bedrock: produce a physician-facing summary from the AUTHORITATIVE
          # Transcribe Medical transcript (the transcript_text this branch
          # receives in its event), NOT the live Deepgram dialog[] turns.
          # summary_prompt_from_transcript + summary_text_from_bedrock_response
          # are mirrored from enrichment.py so the shaping is identical to the
          # offline-tested pure copy.
          #
          # Why the authoritative transcript? The live transcript can mis-hear
          # clinical terms (e.g. a medication name heard as a common word), and
          # summarizing from it propagates the error; Transcribe Medical captures
          # those terms correctly, so the clinical artifact is built from the
          # clinically-accurate source.
          #
          # 🩹 Shortcut → Production: summarizing from the authoritative blob is
          # clinically correct for medication names but LOSES the clean speaker
          # attribution the live dialog turns provide (the blob is one
          # undifferentiated string). Production should reconcile the diarized
          # medical transcript with the live turns to get BOTH speaker structure
          # AND clinical accuracy (see map_turns_by_timestamp_overlap in
          # enrichment.py, unit-tested but intentionally not wired into the demo).
          #
          # Unwrap convention: one event.get("vcon", event) yields the vCon doc.
          import json
          import logging
          import os

          import boto3

          _BEDROCK = boto3.client("bedrock-runtime")


          def _summary_prompt_from_transcript(transcript_text):
              # Present the authoritative transcript verbatim; do NOT fabricate
              # Patient/Agent labels the blob does not carry.
              return (
                  "You are a clinical documentation assistant. Write a concise, "
                  "factual physician-facing summary of the following patient "
                  "intake conversation. Include the chief complaint, duration, "
                  "and any medications mentioned. Do not add diagnoses or "
                  "recommendations.\n\nConversation:\n"
                  + transcript_text
                  + "\n\nSummary:"
              )


          def _summary_text_from_bedrock_response(response):
              content = response.get("content")
              if isinstance(content, list):
                  parts = [
                      b.get("text", "")
                      for b in content
                      if isinstance(b, dict) and b.get("text")
                  ]
                  if parts:
                      return " ".join(parts).strip()
              completion = response.get("completion")
              if isinstance(completion, str) and completion.strip():
                  return completion.strip()
              outputs = response.get("outputs")
              if isinstance(outputs, list):
                  parts = [
                      o.get("text", "")
                      for o in outputs
                      if isinstance(o, dict) and o.get("text")
                  ]
                  if parts:
                      return " ".join(parts).strip()
              return ""


          def _dialog_indices(vcon):
              return [
                  idx
                  for idx, d in enumerate(vcon.get("dialog", []))
                  if d.get("type") == "text"
              ]


          def handler(event, context):
              vcon = event.get("vcon", event)
              # Build the prompt from the AUTHORITATIVE Transcribe Medical
              # transcript text that the Analyze Parallel state passes to this
              # branch (the same transcript_text the Comprehend branch reads),
              # NOT from the live dialog[] turns.
              transcript_text = event.get("transcript_text", "") or ""
              prompt = _summary_prompt_from_transcript(transcript_text)

              summary_text = ""
              # 🩹 Fail-open for demo-runnability: if Bedrock is unavailable
              # (model not enabled, throttled, etc.) fall back to an EMPTY summary
              # rather than failing the pipeline, BUT carry a degraded marker so
              # an operator can tell an intentionally empty summary apart from a
              # silent model failure. → Production: a pinned model id, token
              # accounting, retries, and a hard failure path surfaced to
              # operators.
              degraded = None
              try:
                  body = json.dumps(
                      {
                          "anthropic_version": "bedrock-2023-05-31",
                          "max_tokens": 512,
                          "messages": [
                              {"role": "user", "content": prompt}
                          ],
                      }
                  )
                  resp = _BEDROCK.invoke_model(
                      modelId=os.environ.get("BEDROCK_MODEL_ID", ""),
                      body=body,
                  )
                  payload = json.loads(resp["body"].read())
                  summary_text = _summary_text_from_bedrock_response(payload)
              except Exception as exc:
                  logging.getLogger().exception("bedrock invoke_model failed")
                  summary_text = ""
                  degraded = "bedrock invoke_model failed: {}: {}".format(
                      type(exc).__name__, exc
                  )

              return {
                  "vcon": vcon,
                  "step": "bedrock",
                  "recording_key": event.get("recording_key"),
                  "summary_text": summary_text,
                  "summary_dialog_indices": _dialog_indices(vcon),
                  # Re-emit verbatim so Step Functions carries the structured
                  # segments through this Analyze branch to Merge (unchanged;
                  # only Merge reconciles them).
                  "transcript_segments": event.get("transcript_segments"),
                  "summary_degraded": degraded,
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Final step: merge the transcript + Comprehend + Bedrock outputs into the vCon
  # analysis[] with dialog turn-index provenance, in a deterministic order
  # (transcript, entities, summary). Receives the Parallel state output, which is
  # an ARRAY of the two branch envelopes.
  MergeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-merge-step'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          # Merge branch outputs into analysis[] with turn-index provenance. The
          # analysis entry shapes mirror vcon.py's add_transcript_analysis /
          # add_entities_analysis / add_summary_analysis (type, vendor,
          # authoritative flag, dialog turn-index provenance, body, and an
          # optional `degraded` marker carried from a branch that failed open).
          #
          # The clinical Transcribe Medical transcript is added to analysis[]
          # marked authoritative and sits ALONGSIDE the live Deepgram transcript
          # already in dialog[] (the dual-transcript design). Final analysis order
          # is deterministic: transcript, entities, summary.
          #
          # Input is the Parallel state output: a list of the two branch
          # envelopes (Comprehend branch, Bedrock branch). Each branch carries the
          # same vcon; we take the vcon from the first branch and merge both.


          def _branch(branches, step):
              for b in branches:
                  if isinstance(b, dict) and b.get("step") == step:
                      return b
              return {}


          def _text_dialog_indices(vcon):
              return [
                  idx
                  for idx, d in enumerate(vcon.get("dialog", []))
                  if d.get("type") == "text"
              ]


          def _as_float(value):
              # Mirror of enrichment._as_float: numeric/numeric-string -> float,
              # ISO strings (and everything else) -> None (so ISO dialog starts
              # are skipped by the overlap mapping below).
              if value is None or isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return float(value)
              if isinstance(value, str):
                  try:
                      return float(value)
                  except ValueError:
                      return None
              return None


          # The two fixed vCon party indices (from vcon.py): AGENT_INDEX = 1 /
          # PATIENT_INDEX = 0. Re-declared inline (no imports available here).
          AGENT_INDEX = 1
          PATIENT_INDEX = 0


          def _order_labels_to_parties(first_start):
              # Mirror of enrichment._order_labels_to_parties: earliest orderable
              # label -> AGENT_INDEX (1); with exactly two labels the other ->
              # PATIENT_INDEX (0); with more than two, every non-earliest label ->
              # PATIENT_INDEX (0). A single label, an unorderable (None) start, or
              # a tie on the earliest instant -> None (we do not guess).
              label_to_party = {label: None for label in first_start}
              if len(first_start) < 2:
                  return label_to_party
              orderable = {
                  label: start
                  for label, start in first_start.items()
                  if start is not None
              }
              if not orderable:
                  return label_to_party
              earliest_start = min(orderable.values())
              earliest_labels = [
                  label
                  for label, start in orderable.items()
                  if start == earliest_start
              ]
              if len(earliest_labels) != 1:
                  return label_to_party
              agent_label = earliest_labels[0]
              for label in first_start:
                  if label == agent_label:
                      label_to_party[label] = AGENT_INDEX
                  elif first_start[label] is not None:
                      label_to_party[label] = PATIENT_INDEX
              return label_to_party


          def _reconcile_segments_to_parties(medical_segments, dialog_turns):
              # Mirror of enrichment.reconcile_segments_to_parties: one structured
              # turn per segment ({'party','speaker','start','end','text'}),
              # preserving speaker/start/end/text exactly. Party is assigned BY
              # SPEAKING ORDER, NOT by time overlap: the medical-segment clock
              # (seconds from recording start) and the live dialog-turn clock
              # (seconds from session connect) have DIFFERENT origins, so overlap
              # resolved wrong. Instead we trust Transcribe's diarization and the
              # scripted 'agent speaks first' invariant: the label whose FIRST
              # segment starts earliest is the AGENT (1), the other is the PATIENT
              # (0). One distinct label / ties / unorderable -> None (no guess).
              # dialog_turns is accepted for signature compatibility and is
              # intentionally IGNORED by the order-based mapping.
              # 🩹 Shortcut: relies on the scripted 'agent speaks first'
              # invariant. -> Production: channel separation or robust
              # diarization + identity rather than speaking order.
              first_start = {}
              for seg in medical_segments:
                  speaker = seg.get("speaker", "spk_0")
                  start = _as_float(seg.get("start"))
                  if speaker not in first_start:
                      first_start[speaker] = start
                  else:
                      existing = first_start[speaker]
                      if start is not None and (
                          existing is None or start < existing
                      ):
                          first_start[speaker] = start
              label_to_party = _order_labels_to_parties(first_start)
              turns = []
              for seg in medical_segments:
                  speaker = seg.get("speaker", "spk_0")
                  turns.append(
                      {
                          "party": label_to_party.get(speaker),
                          "speaker": speaker,
                          "start": seg.get("start"),
                          "end": seg.get("end"),
                          "text": seg.get("text", ""),
                      }
                  )
              return turns


          def handler(event, context):
              # The Parallel state hands us a list of branch outputs. Be tolerant
              # of also receiving a single envelope.
              branches = event if isinstance(event, list) else [event]
              comprehend = _branch(branches, "comprehend")
              bedrock = _branch(branches, "bedrock")

              base = comprehend or bedrock or (branches[0] if branches else {})
              vcon = base.get("vcon", base)
              vcon.setdefault("analysis", [])

              # Thread the run-key through to the Seal step: Step Functions passes
              # each task's output verbatim, so the recording_key set by
              # poll-recording must be re-emitted by every intermediate step. The
              # Parallel branches each carry it; take it from whichever branch has
              # it so Seal can locate the run-key S3 prefix.
              recording_key = (
                  comprehend.get("recording_key")
                  or bedrock.get("recording_key")
              )

              transcript_text = comprehend.get("transcript_text", "") or ""
              covered = _text_dialog_indices(vcon)

              # Structured speaker segments thread through from GetTranscription
              # via whichever Analyze branch re-emitted them. When present, build
              # speaker-attributed turns by reconciling them to the party indices
              # BY SPEAKING ORDER (agent speaks first); party resolves to None
              # (spk label only) for a single speaker / ties / unorderable starts.
              transcript_segments = (
                  comprehend.get("transcript_segments")
                  or bedrock.get("transcript_segments")
                  or []
              )

              # 1) transcript (authoritative clinical transcript, dual-transcript).
              transcript_entry = {
                  "type": "transcript",
                  "vendor": "aws-transcribe-medical",
                  "authoritative": True,
                  "dialog": covered,
                  "body": transcript_text,
                  "mimetype": "text/plain",
              }
              # Additive: store reconciled structured turns alongside the flat
              # body ONLY when segments are present, so older segment-less
              # envelopes still produce the byte-identical flat-only entry.
              if transcript_segments:
                  turns = _reconcile_segments_to_parties(
                      transcript_segments, vcon.get("dialog", [])
                  )
                  if turns:
                      transcript_entry["turns"] = turns
              vcon["analysis"].append(transcript_entry)

              # 2) entities (Comprehend Medical, meds + conditions). A
              # `degraded` marker is attached ONLY when the Comprehend branch
              # failed open, so an operator can tell real emptiness from a silent
              # model-access/throttle failure.
              entities = comprehend.get("entities", []) or []
              entities_index = comprehend.get("entities_dialog_index", 0)
              entities_entry = {
                  "type": "entities",
                  "vendor": "aws-comprehend-medical",
                  "dialog": [int(entities_index)],
                  "body": entities,
              }
              entities_degraded = comprehend.get("entities_degraded")
              if entities_degraded:
                  entities_entry["degraded"] = entities_degraded
              vcon["analysis"].append(entities_entry)

              # 3) summary (Bedrock physician summary). Same degraded-marker
              # treatment as entities above.
              summary_text = bedrock.get("summary_text", "") or ""
              summary_indices = bedrock.get("summary_dialog_indices", covered) or covered
              summary_entry = {
                  "type": "summary",
                  "vendor": "aws-bedrock",
                  "dialog": [int(i) for i in summary_indices],
                  "body": summary_text,
                  "mimetype": "text/plain",
              }
              summary_degraded = bedrock.get("summary_degraded")
              if summary_degraded:
                  summary_entry["degraded"] = summary_degraded
              vcon["analysis"].append(summary_entry)

              return {
                  "vcon": vcon,
                  "step": "merge",
                  "status": "ok",
                  "recording_key": recording_key,
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Seal step: turn the completed, enriched vCon into the signed/sealed
  # record and its redacted sibling. Runs AFTER Merge. Sign (JWS), encrypt the
  # full signed copy (JWE), and build the redacted sibling with the vCon
  # `redacted` pointer back to the full version, then PUT the signed JWS, the
  # encrypted full JWE, and the redacted sibling JSON to S3 next to
  # vcon-skeleton.json under the run-key prefix.
  #
  # Unlike the other seven pipeline steps, Seal is NOT an inline Code.ZipFile
  # body. Inline code cannot bundle the third-party jwcrypto dependency (it is
  # NOT in the default AWS Lambda python runtime), so the crypto used to be
  # hand-mirrored from sealing.py inline. The project now packages jwcrypto via a
  # SAM container build: Seal is an AWS::Serverless::Function with CodeUri
  # functions/seal/ and BuildMethod python3.12, so `sam build --use-container`
  # compiles jwcrypto (+ cryptography) for the Lambda runtime from
  # functions/seal/requirements.txt and ships it in the artifact. The packaged
  # handler imports the sealing core packaged alongside it
  # (functions/seal/sealing.py) directly instead of
  # re-mirroring the crypto by hand. Production would pin the JOSE library and
  # build the artifact in CI/CD.
  SealFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # Container build so cryptography compiles for Amazon Linux 2023 /
      # python3.12 / x86_64. Requires Docker: `sam build --use-container`.
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-seal-step'
      Runtime: python3.12
      CodeUri: functions/seal/
      Handler: seal_handler.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref RecordingsBucket
          # 🩹 Shortcut: self-signed demo keypair carried in a Lambda env var
          # (env/local), not a managed key. Set from the VconSigningPrivateJwk
          # CloudFormation parameter; it MUST match the backend's .env
          # VCON_SIGNING_PRIVATE_JWK or the backend cannot decrypt/verify the
          # sealed records. Leaving the parameter empty makes the Seal step
          # generate an ephemeral per-invocation key whose records can never be
          # read back. → Production: AWS KMS / ACM PCA, key rotation, HSM-backed
          # signing; never ship keys with the app.
          VCON_SIGNING_PRIVATE_JWK: !Ref VconSigningPrivateJwk
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

  # ---------------------------------------------------------------------------
  # CloudWatch Logs group for the state machine execution logs.
  # ---------------------------------------------------------------------------
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/${ProjectName}-${Environment}-pipeline'
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Step Functions execution role (trusts states.amazonaws.com).
  # Allows invoking every pipeline Lambda the ASL references and writing
  # execution logs.
  # ---------------------------------------------------------------------------
  StateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-sfn-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-pipeline-lambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt PollRecordingFunction.Arn
                  - !GetAtt LoadSkeletonFunction.Arn
                  - !GetAtt StartTranscriptionFunction.Arn
                  - !GetAtt GetTranscriptionFunction.Arn
                  - !GetAtt ComprehendFunction.Arn
                  - !GetAtt BedrockFunction.Arn
                  - !GetAtt MergeFunction.Arn
                  - !GetAtt SealFunction.Arn
        # CloudWatch Logs for Step Functions logging. These log actions must be
        # granted on "*" per the Step Functions logging requirements.
        - PolicyName: state-machine-logging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Step Functions state machine: the REAL enrichment orchestrator.
  #
  # Flow:
  #   WaitForRecording (poll S3 HeadObject)
  #     -> IsRecordingReady (Choice) -- not ready --> WaitBeforeRecording (Wait)
  #                                                      -> WaitForRecording
  #     -> LoadSkeleton
  #     -> StartTranscription (async Transcribe Medical batch)
  #     -> WaitForTranscription (Wait)  <----------------------+
  #     -> GetTranscription (poll the job once)                |
  #     -> IsTranscriptionComplete (Choice)                    |
  #           COMPLETED -> Analyze                              |
  #           FAILED    -> TranscriptionFailed (Fail)          |
  #           otherwise -> WaitForTranscription ---------------+
  #     -> Analyze (Parallel: Comprehend | Bedrock)
  #     -> Merge (into analysis[] with turn-index provenance)
  #     -> Seal (sign JWS, encrypt JWE, redacted sibling + `redacted` pointer)
  #     -> Done (Succeed)
  #
  # The Wait + GetTranscription + Choice loop is how the STATE MACHINE owns the
  # wait for the async batch job (which can exceed Lambda's 15-min timeout).
  #
  # The DefinitionString uses !Sub to inject the Lambda ARNs.
  # ---------------------------------------------------------------------------
  EnrichmentStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-${Environment}-enrichment'
      RoleArn: !GetAtt StateMachineExecutionRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Real vCon enrichment pipeline: poll S3 -> Transcribe Medical async batch -> Comprehend Medical + Bedrock (parallel) -> merge into analysis[] with turn-index provenance -> seal (JWS sign, JWE encrypt, redacted sibling with the vCon `redacted` pointer).",
          "StartAt": "WaitForRecording",
          "States": {
            "WaitForRecording": {
              "Type": "Task",
              "Resource": "${PollRecordingFunction.Arn}",
              "Next": "IsRecordingReady"
            },
            "IsRecordingReady": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.recording_ready",
                  "BooleanEquals": true,
                  "Next": "LoadSkeleton"
                }
              ],
              "Default": "WaitBeforeRecording"
            },
            "WaitBeforeRecording": {
              "Type": "Wait",
              "Seconds": 5,
              "Next": "WaitForRecording"
            },
            "LoadSkeleton": {
              "Type": "Task",
              "Resource": "${LoadSkeletonFunction.Arn}",
              "Next": "StartTranscription"
            },
            "StartTranscription": {
              "Type": "Task",
              "Resource": "${StartTranscriptionFunction.Arn}",
              "Next": "WaitForTranscription"
            },
            "WaitForTranscription": {
              "Type": "Wait",
              "Seconds": 5,
              "Next": "GetTranscription"
            },
            "GetTranscription": {
              "Type": "Task",
              "Resource": "${GetTranscriptionFunction.Arn}",
              "Next": "IsTranscriptionComplete"
            },
            "IsTranscriptionComplete": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.transcription_status",
                  "StringEquals": "COMPLETED",
                  "Next": "Analyze"
                },
                {
                  "Variable": "$.transcription_status",
                  "StringEquals": "FAILED",
                  "Next": "TranscriptionFailed"
                }
              ],
              "Default": "WaitForTranscription"
            },
            "Analyze": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "Comprehend",
                  "States": {
                    "Comprehend": {
                      "Type": "Task",
                      "Resource": "${ComprehendFunction.Arn}",
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "Bedrock",
                  "States": {
                    "Bedrock": {
                      "Type": "Task",
                      "Resource": "${BedrockFunction.Arn}",
                      "End": true
                    }
                  }
                }
              ],
              "Next": "Merge"
            },
            "Merge": {
              "Type": "Task",
              "Resource": "${MergeFunction.Arn}",
              "Next": "Seal"
            },
            "Seal": {
              "Type": "Task",
              "Resource": "${SealFunction.Arn}",
              "Next": "Done"
            },
            "TranscriptionFailed": {
              "Type": "Fail",
              "Error": "TranscriptionFailed",
              "Cause": "Transcribe Medical job did not complete successfully."
            },
            "Done": {
              "Type": "Succeed"
            }
          }
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  BucketName:
    Description: >-
      Name of the S3 bucket for recordings and vCons. Maps to BUCKET_NAME in the
      local .env.
    Value: !Ref RecordingsBucket

  StateMachineArn:
    Description: >-
      ARN of the enrichment Step Functions state machine, invoked via
      StartExecution. Maps to STATE_MACHINE_ARN in the local .env.
    Value: !Ref EnrichmentStateMachine

  Region:
    Description: >-
      AWS region the stack was deployed into. Maps to AWS_REGION in the local
      .env.
    Value: !Ref AWS::Region
